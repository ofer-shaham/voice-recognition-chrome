name: E2E tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start application stack
        run: docker compose -f docker-compose.test.yml up -d --wait server client

      - name: Run E2E with video recording
        run: docker compose -f docker-compose.test.yml --profile test run --rm --no-deps cypress

      - name: Upload Cypress recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invidious-e2e-recordings-${{ github.run_number }}
          path: |
            cypress/videos/**/*.mp4
            cypress/screenshots/**/*
          if-no-files-found: error
          retention-days: 14

      - name: Stop test stack
        if: always()
        run: docker compose -f docker-compose.test.yml down --volumes --remove-orphans
